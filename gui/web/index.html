<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="focusd-token" content="__FOCUSD_TOKEN__">
<meta name="color-scheme" content="light dark">
<title>DeepFocus</title>
<link rel="icon" href="/favicon.ico">
<script src="/assets/preboot.js"></script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Primary">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="16.5" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="20" cy="20" r="8.5" stroke="currentColor" stroke-width="2.4" opacity=".55"/>
          <circle cx="20" cy="20" r="3.2" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-word">deepfocus<span class="brand-dot">.</span></span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" stroke-linejoin="round"/></svg>
        <span data-i18n="nav.dashboard">Dashboard</span>
        <kbd>1</kbd>
      </button>
      <button class="nav-item" data-view="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h16M8 16v-4m4 4V8m4 8v-6" stroke-linecap="round"/></svg>
        <span data-i18n="nav.stats">Statistics</span>
        <kbd>2</kbd>
      </button>
      <button class="nav-item" data-view="focus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6" stroke-linecap="round"/></svg>
        <span data-i18n="nav.focus">Focus</span>
        <kbd>3</kbd>
      </button>
      <button class="nav-item" data-view="limits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4.5 6v6c0 4.4 3.1 7.6 7.5 9 4.4-1.4 7.5-4.6 7.5-9V6L12 3Z" stroke-linejoin="round"/><path d="M12 8v5" stroke-linecap="round"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="nav.limits">Limits</span>
        <kbd>4</kbd>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10m4 0h2M4 17h4m4 0h8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
        <span data-i18n="nav.settings">Settings</span>
        <kbd>5</kbd>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="tracker-pill" id="trackerPill">
        <span class="pulse" id="trackerPulse"></span>
        <span id="trackerLabel">Connecting…</span>
      </div>
      <div class="foot-row">
        <button class="icon-btn" id="langBtn" title="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3.5 9h17M3.5 15h17M12 3c2.5 2.4 3.8 5.4 3.8 9s-1.3 6.6-3.8 9c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3Z"/></svg>
          <span id="langLabel">中</span>
        </button>
        <button class="icon-btn" id="themeBtn" title="Theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="foot-meta">
        <span id="versionLabel">v…</span>
        <button class="link-btn" id="shortcutHint" title="Keyboard shortcuts">?</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="crumb" id="crumbDate">—</span>
        <span class="dot-sep"></span>
        <span class="crumb-sub" id="crumbSub">Local only</span>
      </div>
      <div class="topbar-right">
        <div class="pomodoro-chip hidden" id="pomodoroChip" role="button" tabindex="0">
          <span class="pomo-dot"></span>
          <span class="pomo-time" id="pomodoroChipTime">25:00</span>
          <span class="pomo-label" data-i18n="focus.running">Focus running</span>
        </div>
        <button class="btn btn-ghost" id="pauseBtn" data-action="pause">
          <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5v14M15 5v14" stroke-linecap="round"/></svg>
          <svg class="icon-play hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>
          <span id="pauseLabel">Pause</span>
        </button>
        <button class="icon-btn refresh" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="update-notice" id="updateNotice" hidden></div>
    <div class="view" id="view" aria-live="polite"></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="assertive"></div>
<div id="modalRoot"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>

<script src="/assets/i18n.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
