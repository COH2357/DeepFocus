<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepFocus · 停一下</title>
<link rel="stylesheet" href="block.css">
</head>
<body>
<main class="shell">
  <header class="brand"><span class="mark"><i></i></span><span>deepfocus.</span><em>EXTENSION GUARD</em></header>
  <section class="grid">
    <div class="left">
      <div class="kicker" id="kicker">网站限制</div>
      <h1>停一下。</h1>
      <div class="site" id="siteLabel">—</div>
      <p class="lede" id="lede">这个网站需要先说明用途，才会临时放行。</p>
      <div class="usage"><div class="usage-head"><span>今天已用</span><b id="used">—</b></div><div class="bar"><i id="bar"></i></div><div class="usage-foot"><span id="limit">—</span><span id="mode">—</span></div></div>
      <blockquote id="quote">把注意力还给自己。</blockquote>
    </div>
    <div class="right">
      <div class="card">
        <div class="card-kicker">ACCESS REQUEST</div>
        <h2>为什么现在<br>需要它？</h2>
        <p class="hint" id="hint">写一个理由，选择放行时长。理由只保存在本地。</p>
        <label class="field-label" for="reason">理由</label>
        <textarea id="reason" maxlength="500" placeholder="例如：查一个工作资料，大约 10 分钟。"></textarea>
        <div class="durations" id="durations">
          <button type="button" data-minutes="5">5 分钟</button>
          <button type="button" data-minutes="15" class="active">15 分钟</button>
          <button type="button" data-minutes="30">30 分钟</button>
          <button type="button" data-minutes="60">60 分钟</button>
        </div>
        <div class="custom-duration"><input id="customMinutes" type="number" min="1" max="1440" step="1" placeholder="自定义"><span>分钟</span></div>
        <button class="primary" id="grant" type="button" disabled>确认放行</button>
        <button class="ghost" id="back" type="button">返回上一页</button>
        <p class="fine" id="fine">放行只对这一类站点生效；到期后会重新拦截。</p>
      </div>
      <div class="audit"><span></span> 放行记录保存在 DeepFocus 本地数据库。</div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script src="block.js"></script>
</body>
</html>
